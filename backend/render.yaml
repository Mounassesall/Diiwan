services:
  - type: web
    name: diiwan-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: diiwan-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "diiwan-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://diiwan-frontend.vercel.app,http://localhost:5173,http://localhost:8081"
      - key: USE_GENERATIVE_AI
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      # GEMINI_API_KEY must be set manually in the Render dashboard

databases:
  - name: diiwan-db
    databaseName: diiwan
    user: diiwan_user
    plan: free
